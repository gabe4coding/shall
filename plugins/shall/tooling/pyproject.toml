[project]
name = "shall"
version = "0.1.0"
description = "shall: RFC-2119 standards corpus tooling - lint, index, Jev-based applicability selection, agent review, CI reports"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.2,<0.8",
    "pyyaml>=6",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.0",
]

[project.scripts]
shall = "shall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shall"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
