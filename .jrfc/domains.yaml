# Local domains of the jrfc tooling repo. Organisation domains (python, security, ...) are reused.
domains:
  model-calls:
    title: Model calls and agent boundaries
    description: How the jrfc tooling calls Jev (TypeSafe) and Claude, and what model output may and may not decide.
    owner: ai-governance
    applies_when: The content calls Jev or Claude, builds Jev state or questions, builds an agent prompt, runs `claude`, or uses model output.
    not_applies_when: The content does not call a model and does not use model output.
  claude-plugin:
    title: Claude Code plugin content
    description: Skills, agents and manifests of the jrfc Claude Code plugin.
    owner: ai-governance
    applies_when: The content adds or changes a SKILL.md, an agent definition, or a plugin or marketplace manifest.
    not_applies_when: The content is not a skill, agent definition or plugin manifest.
