# Copy to .github/workflows/ in an application repository.
#
# Corpus layers:
#   - organisation corpus: pinned by `extends:` in .jrfc/jrfc.yaml, or by JRFC_EXTENDS below
#     for repositories without local standards; fetched into ~/.cache/jrfc
#   - local corpus: .jrfc/rfcs/ in this repository (optional)
#
# Secrets: TYPESAFE_API_KEY, ANTHROPIC_API_KEY, JRFC_GIT_TOKEN (read access to the
# organisation corpus and tooling repos, if private).
# Data: diffs are sent to TypeSafe and Anthropic. Get data-protection approval first
# (TypeSafe zero data retention is an enterprise-plan feature).
#
# Exit codes of the review step: 0 ok · 2 blocking findings · 3 Jev service failure · 1 other error.
name: jrfc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jrfc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JRFC_EXTENDS: your-org/engineering-standards@v2026.09   # TODO: org corpus @ pinned tag; used only without .jrfc/
  JRFC_GIT_TOKEN: ${{ secrets.JRFC_GIT_TOKEN }}
  JRFC: .jrfc-tooling/plugins/jrfc/bin

jobs:
  # Local standards of this repository: deterministic checks + "local rules must not weaken
  # organisation rules". Runs only when .jrfc/ exists.
  local-standards:
    if: ${{ hashFiles('.jrfc/jrfc.yaml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: your-org/jrfc          # TODO: the tooling repository (this plugin)
          ref: v0.1.0
          path: .jrfc-tooling
          token: ${{ secrets.JRFC_GIT_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jrfc
          key: jrfc-corpus-${{ hashFiles('.jrfc/jrfc.yaml') }}
      - name: Lint local RFCs
        run: $JRFC/jrfc lint
      - name: Local index is up to date
        run: $JRFC/jrfc build --check
      - name: Local statement ids are stable
        run: |
          if git show "origin/${{ github.base_ref }}:.jrfc/index/index.json" > /tmp/base-index.json 2>/dev/null; then
            $JRFC/jrfc lint --quiet --against /tmp/base-index.json
          fi
      - name: Local rules do not duplicate, weaken or conflict with organisation rules
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: $JRFC/jrfc conflicts --local

  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: your-org/jrfc          # TODO: the tooling repository (this plugin)
          ref: v0.1.0
          path: .jrfc-tooling
          token: ${{ secrets.JRFC_GIT_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code

      - name: Restore corpus and Jev answer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jrfc
            .jrfc/.jrfc-cache
            .jrfc-cache
          key: jrfc-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: jrfc-${{ github.event.pull_request.number }}-

      - name: jrfc review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        # Make this job a required check to block merges on exit 2 (enforced MUST findings).
        run: $JRFC/jrfc-pr-review --post ${{ github.event.pull_request.number }} --fail-on-blocking

      - name: Job summary
        if: always()
        run: cat .jrfc-out/pr/review.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jrfc-review
          path: .jrfc-out/pr
