<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="shall">
  <title>shall</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0A111F"/>
    </linearGradient>
    <linearGradient id="ink" x1="190" y1="70" x2="66" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#7DD3FC" stroke-opacity=".18" stroke-width="3"/>
  <!-- an "s" made of three rule lines -->
  <path d="M 184 76 H 102 A 26 26 0 0 0 102 128 H 154 A 26 26 0 0 1 154 180 H 72" fill="none" stroke="url(#ink)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rule numbers -->
  <g fill="#7DD3FC" fill-opacity=".55">
    <circle cx="214" cy="76" r="9"/>
    <circle cx="42" cy="180" r="9"/>
  </g>
</svg>
