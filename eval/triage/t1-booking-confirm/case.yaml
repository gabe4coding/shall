# Comments that AI reviewers could leave on pr.diff (a new booking confirmation handler).
# `expected` is the hand label: relevant (a real problem a developer should see), noise
# (praise, nits, generic advice, a repeated concern, or a claim that repo/ refutes), outdated.
# Comments by people are skipped by triage and carry no label.
why: >
  Mixed bag of true findings, a duplicate, nits, praise, and two false claims that another
  file refutes: request() in src/http/client.ts sets the timeout; queryOne() in src/db.ts
  returns one row, not an array.
