  - id: py-edit-session-timeout-far
    event: PostToolUse
    tool: Edit
    file: svc/partner.py
    input: {old_string: "return None", new_string: "        return self.session.get(self.base + path).json()"}
    content: |
      import requests
      from requests.adapters import HTTPAdapter


      class TimeoutAdapter(HTTPAdapter):
          """Every request through this adapter gets a 2 second timeout."""

          def __init__(self, timeout: float = 2.0, **kwargs) -> None:
              self.timeout = timeout
              super().__init__(**kwargs)

          def send(self, request, **kwargs):
              kwargs.setdefault("timeout", self.timeout)
              return super().send(request, **kwargs)


      def make_session() -> requests.Session:
          session = requests.Session()
          session.mount("https://", TimeoutAdapter(timeout=2.0))
          return session


      # The partner API is slow on Mondays; keep calls short and cached.
      # See runbook PARTNER-12 for the escalation contacts.
      CACHE_SECONDS = 60
      MAX_PAGE = 50


      class PartnerClient:
          def __init__(self, base: str) -> None:
              self.base = base
              self.session = make_session()

          def get(self, path: str) -> dict:
              return self.session.get(self.base + path).json()
    violates: []
