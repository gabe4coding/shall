# Whole-file scan eval: ids only, file content is read with `git show <sha>:<path>`
# from the local checkout, so no source code is stored in this repository.
repos:
  sca-gap-map:
    url: git@github.com:gabe4coding/sca-gap-map.git
    checkout: ~/Repositories/thefork/sca-gap-map
    sha: fc89f0d0476403d0a5b620029bd1d79e3969164b
  plainwright:
    url: git@github.com:gabe4coding/plainwright.git
    checkout: ~/Repositories/plainwright
    sha: b18d4e359917b23e8bcd6fa027e2715a4e4bae24
excluded:
  sca-gap-map/sca_gap_map/baseline_data.py: embedded BlackDuck audit data (vulnerability rows); must not go to TypeSafe
  tests, fixtures, generated: not the code a scan must judge first
  plainwright/examples/*.yaml, examples/mobile/: plainwright test specs, not code
  plainwright/plugins/*/bin/launch.mjs: 3 byte-identical copies of scripts/plugin-launcher.mjs
